<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="radarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e53935;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1d4ed8;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#radarGradient)" />
  
  <!-- Radar circles -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.3" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.4" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5" />
  <circle cx="256" cy="256" r="50" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6" />
  
  <!-- Radar sweep -->
  <path d="M256,256 L256,56 A200,200 0 0,1 456,256" fill="url(#radarGlow)" opacity="0.7" />
  <line x1="256" y1="256" x2="456" y2="56" stroke="#e53935" stroke-width="6" stroke-linecap="round" />
  
  <!-- Center point -->
  <circle cx="256" cy="256" r="20" fill="#e53935" stroke="#ffffff" stroke-width="4" />
  
  <!-- Weather icons -->
  <text x="80" y="420" font-size="48" fill="#ffffff">🌧</text>
  <text x="400" y="420" font-size="48" fill="#ffffff">⚡</text>
  <text x="80" y="100" font-size="48" fill="#ffffff">☁</text>
  <text x="400" y="100" font-size="48" fill="#ffffff">🌡</text>
  
  <!-- T.F.R text -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">T.F.R</text>
</svg>