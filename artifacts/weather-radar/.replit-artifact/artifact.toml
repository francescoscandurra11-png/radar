kind = "web"
previewPath = "/"
title = "TFR Weather Pro"
version = "1.0.0"
id = "artifacts/weather-radar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20405

[services.development]
run = "pnpm --filter @workspace/weather-radar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weather-radar", "run", "build" ]
serve = "static"
publicDir = "artifacts/weather-radar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20405"
BASE_PATH = "/"
